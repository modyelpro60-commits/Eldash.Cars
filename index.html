<!DOCTYPE html>

<head>

<meta property="og:description" content="تواصل مع معرض Hmada Eldash Auto">

<style>
  :root{
    --gold-1:#fff6c9;
    --gold-2:#f7d774;
    --gold-3:#d4a52c;
    --gold-4:#a8771a;
    --gold-5:#6b4a0c;
    --ink:#0a0806;
    --gold-grad:linear-gradient(135deg,var(--gold-5) 0%,var(--gold-3) 22%,var(--gold-1) 45%,var(--gold-2) 55%,var(--gold-4) 78%,var(--gold-5) 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"Cairo",system-ui,sans-serif;
    color:var(--gold-1);
    background:var(--ink);
    overflow-x:hidden;
  }

  /* ---------- Background ---------- */
  .bg{
    position:fixed;inset:0;z-index:-2;
    background:url("bg.jpg") center/cover no-repeat;
    animation:bgDrift 24s ease-in-out infinite alternate;
    transform-origin:70% 60%;
  }
  .bg-shade{
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(ellipse at 50% 15%,rgba(212,165,44,.18),transparent 55%),
      linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,.9) 100%);
  }
  @keyframes bgDrift{from{transform:scale(1.08) translateX(0)}to{transform:scale(1.18) translateX(-3%)}}

  /* gold dust */
  .sparks{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .sparks i{
    position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;
    background:var(--gold-2);box-shadow:0 0 8px 2px rgba(247,215,116,.7);
    opacity:0;animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    10%{opacity:.9}
    100%{transform:translateY(-105vh) translateX(30px);opacity:0}
  }

  .wrap{
    width:min(460px,100%);
    margin:0 auto;
    padding:32px 18px 40px;
    display:flex;flex-direction:column;align-items:center;gap:22px;
  }

  /* ---------- Logo in moving gold frame ---------- */
  .frame{
    position:relative;width:100%;
    padding:5px;border-radius:22px;
    background:conic-gradient(from var(--ang),var(--gold-5),var(--gold-3),var(--gold-1),var(--gold-2),var(--gold-4),var(--gold-5),var(--gold-3),var(--gold-1),var(--gold-5));
    animation:spin 4s linear infinite, framePulse 6s ease-in-out infinite;
  }
  @property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
  @keyframes spin{to{--ang:360deg}}
  @keyframes framePulse{
    0%,100%{box-shadow:0 0 18px rgba(247,215,116,.4),0 0 50px rgba(212,165,44,.2)}
    50%{box-shadow:0 0 32px rgba(255,236,160,.75),0 0 90px rgba(212,165,44,.45)}
  }
  .frame-inner{
    position:relative;border-radius:18px;overflow:hidden;background:#000;
    border:1px solid rgba(255,246,201,.35);
  }
  .frame-inner img{display:block;width:100%;height:auto}
  /* light sweep across the logo */
  .frame-inner::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,248,215,.45) 50%,transparent 65%);
    transform:translateX(-120%);
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{0%,82%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  /* corner ornaments */
  .corner{position:absolute;width:18px;height:18px;border:2px solid var(--gold-1);z-index:2;filter:drop-shadow(0 0 4px var(--gold-2))}
  .c1{top:-4px;right:-4px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
  .c2{top:-4px;left:-4px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
  .c3{bottom:-4px;right:-4px;border-left:0;border-top:0;border-radius:0 0 10px 0}
  .c4{bottom:-4px;left:-4px;border-right:0;border-top:0;border-radius:0 0 0 10px}

  /* ---------- Name shimmer every 3s ---------- */
  .name{
    font-family:"Cinzel","Cairo",serif;font-weight:900;
    font-size:clamp(28px,8.5vw,40px);letter-spacing:1px;text-align:center;line-height:1.15;
    direction:ltr;
    background:linear-gradient(100deg,var(--gold-4) 0%,var(--gold-3) 30%,var(--gold-2) 42%,#fff 50%,var(--gold-2) 58%,var(--gold-3) 70%,var(--gold-4) 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s ease-in-out infinite;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.8)) drop-shadow(0 0 10px rgba(212,165,44,.35));
  }
  @keyframes shine{
    0%{background-position:120% 0}
    45%,100%{background-position:-20% 0}
  }
  .tag{
    font-family:"Aref Ruqaa","Amiri","Cairo",serif;font-weight:700;
    font-size:clamp(30px,9vw,46px);line-height:1.4;text-align:center;white-space:nowrap;
    background:linear-gradient(180deg,#fff6c9 0%,#f7d774 35%,#d4a52c 60%,#8a5f12 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(212,165,44,.35));
    margin-top:-4px;
  }
  .divider{
    width:70%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
    box-shadow:0 0 10px var(--gold-3);
  }

  /* ---------- Buttons ---------- */
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .btn{
    position:relative;display:flex;align-items:center;gap:14px;
    width:100%;padding:12px 14px;border-radius:16px;
    text-decoration:none;color:var(--gold-1);
    background:linear-gradient(180deg,rgba(30,22,8,.85),rgba(8,6,3,.92));
    border:1.5px solid transparent;
    background-clip:padding-box;
    overflow:hidden;isolation:isolate;
    opacity:0;transform:translateY(18px);
    animation:enter .6s cubic-bezier(.2,.8,.2,1) forwards;
    box-shadow:0 6px 18px rgba(0,0,0,.55);
    transition:transform .2s ease;
    cursor:pointer;font:inherit;text-align:start;
  }
  /* gold gradient border */
  .btn::before{
    content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;z-index:-1;
    background:var(--gold-grad);background-size:200% 200%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:borderMove 4s linear infinite;
  }
  /* light sweep */
  .btn:hover,.btn:active{transform:translateY(-2px) scale(1.015)}
  .btn:active{transform:scale(.98)}
  @keyframes enter{to{opacity:1;transform:none}}
  @keyframes borderMove{to{background-position:200% 200%}}

  .ico{
    flex:none;width:50px;height:50px;border-radius:14px;
    display:grid;place-items:center;
    box-shadow:inset 0 0 0 1.5px rgba(255,246,201,.55),0 0 12px rgba(0,0,0,.4);
    animation:icoPulse 3s ease-in-out infinite;animation-delay:var(--d2,0s);
  }
  .ico svg{width:27px;height:27px;fill:#fff}
  @keyframes icoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .wa .ico{background:linear-gradient(145deg,#2fe474,#128c4a)}
  .call .ico{background:var(--gold-grad)}
  .call .ico svg{fill:#1a1206}
  .tt .ico{background:linear-gradient(145deg,#111,#000);box-shadow:inset 0 0 0 1.5px rgba(255,246,201,.55),-2px -2px 0 #25f4ee inset,2px 2px 0 #fe2c55 inset}
  .fb .ico{background:linear-gradient(145deg,#2d88ff,#1559c9)}
  .ip .ico{background:#fff;overflow:hidden}
  .ip .ico img{width:100%;height:100%;object-fit:contain;border-radius:14px}

  .txt{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0}
  .txt b{font-size:17px;font-weight:700;color:#fff3c4}
  .txt small{font-size:13px;color:#cbb980;direction:ltr;text-align:right;unicode-bidi:plaintext}
  .arrow{flex:none;width:22px;height:22px;fill:var(--gold-2);opacity:.85;transform:scaleX(-1)}

  footer{margin-top:8px;font-size:12px;color:#9c8a57;text-align:center}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);
    background:var(--gold-grad);color:#1a1206;font-weight:700;
    padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;
    transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.6)
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}


  /* phones (portrait): show the car side of the background + lighter shade */
  @media (max-aspect-ratio:1/1){
    .bg{
      background-position:84% 55%;
      height:100lvh;bottom:auto;
      animation:bgDriftM 20s ease-in-out infinite alternate;
      transform-origin:84% 55%;
    }
    @keyframes bgDriftM{from{transform:scale(1.02)}to{transform:scale(1.1)}}
    .bg-shade{
      background:
        radial-gradient(ellipse at 50% 12%,rgba(212,165,44,.16),transparent 55%),
        linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.6) 100%);
    }
    .btn{background:linear-gradient(180deg,rgba(25,18,6,.72),rgba(8,6,3,.8))}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important}
    .btn{opacity:1;transform:none}
  }
</style>
</head>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  // floating gold dust
  (function(){
    var box = document.getElementById('sparks');
    for (var i = 0; i < 22; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (7 + Math.random()*9) + 's';
      s.style.animationDelay = (Math.random()*10) + 's';
      var z = (1 + Math.random()*2.5).toFixed(1);
      s.style.width = s.style.height = z + 'px';
      box.appendChild(s);
    }
  })();
</script>
